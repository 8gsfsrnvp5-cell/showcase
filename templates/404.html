<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Страница не найдена</title>
  <script>
    // GitHub Pages serves this page for every missing path. Single-page apps
    // with client-side routes get the path back through ?__path=…
    (function () {
      var SPA = ['skyseal-cargo', 'aero-cargo'];
      var m = location.pathname.match(/^(\/showcase\/)([^/]+)(\/.*)?$/);
      if (m && SPA.indexOf(m[2]) >= 0 && m[3] && m[3] !== '/') {
        var search = location.search ? '&' + location.search.slice(1) : '';
        location.replace(m[1] + m[2] + '/?__path=' + encodeURIComponent(m[3]) + search + location.hash);
      }
    })();
  </script>
  <style>
    :root { --bg: #f6f5f1; --ink: #191917; --muted: #6c6a64; --accent: #1f5f4a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141412; --ink: #f1efe9; --muted: #a29f97; --accent: #7fc8ad; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; text-align: center; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0 0 20px; }
    a { color: var(--accent); font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела. Все проекты собраны на главной странице.</p>
    <a href="/showcase/">Перейти ко всем проектам →</a>
  </main>
</body>
</html>
